name: Calc Build

on:
  push:
    branches: [main, iOS/Android-compatibility]
  pull_request:
    branches: [main, iOS/Android-compatibility]
  workflow_dispatch:

concurrency:
  group: calc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android & Rechner-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Run shared calculator tests
        run: |
          chmod +x gradlew
          ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoStrokeCalc-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Android Build"
            echo ""
            echo "- **Tests:** \`:shared:testAndroidHostTest\` (Rechner-Unit-Tests im shared-Modul)"
            echo "- **Artifact:** \`TwoStrokeCalc-android-debug\` (Debug-APK, 14 Tage)"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build sharedKit framework for Simulator
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          mkdir -p shared/build/xcode-frameworks/Debug/iphonesimulator
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/sharedKit.framework \
            shared/build/xcode-frameworks/Debug/iphonesimulator/

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project iosApp/TwoStrokeCalcIOS.xcodeproj \
            -scheme TwoStrokeCalcIOS \
            -derivedDataPath build/ios/DerivedData \
            -resolvePackageDependencies

      - name: Stamp CI build metadata
        run: |
          PLIST="iosApp/TwoStrokeCalcIOS/Resources/Info.plist"
          SHORT_SHA="${GITHUB_SHA::7}"
          /usr/libexec/PlistBuddy -c "Delete :CIBuildCommit" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CIBuildCommit string $SHORT_SHA" "$PLIST"
          echo "Stamped CIBuildCommit=$SHORT_SHA"

      - name: Build iOS app (Simulator .app)
        run: |
          xcodebuild \
            -project iosApp/TwoStrokeCalcIOS.xcodeproj \
            -scheme TwoStrokeCalcIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=TwoStrokeCalcIOS/Resources/TwoStrokeCalcIOS.entitlements \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package Simulator app for upload
        run: |
          APP_PATH="build/ios/DerivedData/Build/Products/Debug-iphonesimulator/TwoStrokeCalcIOS.app"
          test -d "$APP_PATH" || (echo "Missing $APP_PATH" && find build/ios -name '*.app' && exit 1)
          mkdir -p build/ios
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/build/ios/TwoStrokeCalcIOS-simulator.zip" TwoStrokeCalcIOS.app

      - name: Upload Simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwoStrokeCalcIOS-simulator
          path: build/ios/TwoStrokeCalcIOS-simulator.zip
          retention-days: 14

      - name: Deploy to Appetize (browser simulator)
        id: appetize
        if: vars.APPETIZE_ENABLED == 'true'
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          appFile: build/ios/TwoStrokeCalcIOS-simulator.zip
          platform: ios
          publicKey: ${{ vars.APPETIZE_PUBLIC_KEY }}
          note: ${{ github.repository }}@${{ github.sha }}

      - name: Verify Appetize deploy metadata
        if: vars.APPETIZE_ENABLED == 'true'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          curl -sS -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            "https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" > appetize-app.json
          python3 - <<'PY'
          import json
          with open("appetize-app.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          app = payload if isinstance(payload, dict) and "publicKey" in payload else payload.get("data", payload)
          print(f"Appetize updated: {app.get('updated', 'unknown')}")
          print(f"Appetize versionCode: {app.get('versionCode', 'unknown')}")
          PY

      - name: Job summary
        if: always()
        run: |
          {
            echo "## iOS Build"
            echo ""
            echo "- **Artifact:** \`TwoStrokeCalcIOS-simulator.zip\` (Simulator-.app, 14 Tage)"
            echo "- **Browser-Test:** [IOS_TESTING_WITHOUT_MAC.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/iosApp/IOS_TESTING_WITHOUT_MAC.md)"
            if [ "${{ vars.APPETIZE_ENABLED }}" = "true" ]; then
              KEY="${{ steps.appetize.outputs.publicKey }}"
              if [ -z "$KEY" ]; then KEY="${{ vars.APPETIZE_PUBLIC_KEY }}"; fi
              if [ -n "$KEY" ]; then
                echo "- **CI-Build:** \`${GITHUB_SHA::7}\`"
                echo "- **Appetize (Live):** https://appetize.io/app/$KEY"
                echo "- **Appetize (Dashboard):** https://appetize.io/apps"
                echo "- **Hinweis:** Laufende Appetize-Session beenden und Seite neu laden, damit das neue Build startet."
              else
                echo "- **Appetize:** Upload-Schritt fehlgeschlagen oder übersprungen – Log prüfen"
              fi
            else
              echo "- **Appetize:** Repository-Variable \`APPETIZE_ENABLED=true\` + Secret \`APPETIZE_API_TOKEN\` setzen"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
