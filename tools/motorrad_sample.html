n und eine Upside-down-Telegabel. Zu den Merkmalen gehören ein TFT-Display, LED-Beleuchtung und verschiedene Fahrmodi. Die Sitzhöhe beträgt 890 mm, und das Leergewicht liegt bei 147 kg. Modelle wie die Husqvarna 701 Supermoto, die Yamaha WR450F und die Suzuki DR-Z400SM bieten vergleichbare Leistungsdaten.Die 690 SMC R wurde entwickelt, um sportliche Performance mit urbaner Wendigkeit zu kombinieren. Seit ihrer Einführung hat sie sich als Favorit für Fahrer etabliert, die ein agiles und leichtes Motorrad suchen. Die KTM 690 SMC R steht für die Fähigkeit von KTM, innovative und aufregende Motorräder zu entwickeln, die sowohl auf der Straße als auch im leichten Gelände überzeugen. Ihre Konstruktion und Technologie bieten eine außergewöhnliche Balance zwischen Leistung und Fahrspaß. Mit ihrem dynamischen Design und der fortschrittlichen Technik ist sie ein Highlight im Supermoto-Segment.","url":"https://www.motorradonline.de/marken-modelle/ktm/690-smc-r/","articleSection":"Motorräder, Motorräder A-Z, KTM, 690 SMC R, ","headline":"690 SMC R","inLanguage":"deutsch, german","keywords":"690,SMC,R","mainEntityOfPage":{"@type":"WebPage","@id":"https://www.motorradonline.de/marken-modelle/ktm/690-smc-r/","relatedLink":[]},"isFamilyFriendly":true},{"@context":"https://schema.org","@type":"ItemList","itemListElement":[{"@type":"ListItem","position":1,"item":"https://www.motorradonline.de/supermoto/ducati-hypermotard-698-mono-und-ktm-690-smcr-vergleich-test/","name":"Ducati Hypermotard 698 Mono und KTM 690 SMC R: Supermotos im Test-Vergleich"},{"@type":"ListItem","position":2,"item":"https://www.motorradonline.de/supermoto/ktm-690-smcr-vs-gasgas-sm-700-vergleichstest/","name":"KTM 690 SMC R vs. GasGas SM 700 im Vergleichstest: Alles für den Fahrspaß!"},{"@type":"ListItem","position":3,"item":"https://www.motorradonline.de/supermoto/husqvarna-701-supermoto-und-ktm-690-smc-r-supermotos-im-vergleichstest/","name":"Husqvarna 701 Supermoto und KTM 690 SMC R im Vergleichstest"},{"@type g, Praxis im Alltag, Sicherheitsaspekte und Unterhaltskosten der %Headline% von unserer unabhängigen Testredaktion genau unter die Lupe genommen. Profitieren Sie beim Motorradkauf von ausführlichen Einzel- und Vergleichstests sowie Dauertests und Fahrberichten zur %Headline%. Die KTM 690 SMC R ist ein supermotard-inspiriertes Motorrad, das durch seine Agilität und dynamische Fahrweise besticht. Der wassergekühlte Einzylindermotor leistet 74 PS bei 8.000 U/min und bietet ein Drehmoment von 73 Nm bei 6.500 U/min. Das Motorrad verfügt über ein Sechsgang-Getriebe, einen leichten Stahlrahmen und eine Upside-down-Telegabel. Zu den Merkmalen gehören ein TFT-Display, LED-Beleuchtung und verschiedene Fahrmodi. Die Sitzhöhe beträgt 890 mm, und das Leergewicht liegt bei 147 kg. Modelle wie die Husqvarna 701 Supermoto, die Yamaha WR450F und die Suzuki DR-Z400SM bieten vergleichbare Leistungsdaten.Die 690 SMC R wurde entwickelt, um sportliche Performance mit urbaner Wendigkeit zu kombinieren. Seit ihrer Einführung hat sie sich als Favorit für Fahrer etabliert, die ein agiles und leichtes Motorrad suchen. Die KTM 690 SMC R steht für die Fähigkeit von KTM, innovative und aufregende Motorräder zu entwickeln, die sowohl auf der Straße als auch im leichten Gelände überzeugen. Ihre Konstruktion und Technologie bieten eine außergewöhnliche Balance zwischen Leistung und Fahrspaß. Mit ihrem dynamischen Design und der fortschrittlichen Technik ist sie ein Highlight im Supermoto-Segment.\",\"url\":\"https://www.motorradonline.de/marken-modelle/ktm/690-smc-r/\",\"articleSection\":\"Motorräder, Motorräder A-Z, KTM, 690 SMC R, \",\"headline\":\"690 SMC R\",\"inLanguage\":\"deutsch, german\",\"keywords\":\"690,SMC,R\",\"mainEntityOfPage\":{\"@type\":\"WebPage\",\"@id\":\"https://www.motorradonline.de/marken-modelle/ktm/690-smc-r/\",\"relatedLink\":[]},\"isFamilyFriendly\":true},{\"@context\":\"https://schema.org\",\"@type\":\"ItemList\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\" hmoment von 73 Nm bei 6.500 U/min. Das Motorrad verfügt über ein Sechsgang-Getriebe, einen leichten Stahlrahmen und eine Upside-down-Telegabel. Zu den Merkmalen gehören ein TFT-Display, LED-Beleuchtung und verschiedene Fahrmodi. Die Sitzhöhe beträgt 890 mm, und das Leergewicht liegt bei 147 kg. Modelle wie die Husqvarna 701 Supermoto, die Yamaha WR450F und die Suzuki DR-Z400SM bieten vergleichbare Leistungsdaten.\u003c/p\u003e\u003cp\u003eDie 690 SMC R wurde entwickelt, um sportliche Performance mit urbaner Wendigkeit zu kombinieren. Seit ihrer Einführung hat sie sich als Favorit für Fahrer etabliert, die ein agiles und leichtes Motorrad suchen. Die KTM 690 SMC R steht für die Fähigkeit von KTM, innovative und aufregende Motorräder zu entwickeln, die sowohl auf der Straße als auch im leichten Gelände überzeugen. Ihre Konstruktion und Technologie bieten eine außergewöhnliche Balance zwischen Leistung und Fahrspaß. Mit ihrem dynamischen Design und der fortschrittlichen Technik ist sie ein Highlight im Supermoto-Segment.\u003c/p\u003e","title":"\u003cp\u003eKTM 690 SMC R im Test bei MOTORRAD. Die Testfahrer und Testingenieure von MOTORRAD haben die KTM 690 SMC R ausführlich getestet. Dabei wurden Fahreigenschaften, Handhabung, Praxis im Alltag, Sicherheitsaspekte und Unterhaltskosten der KTM 690 SMC R von unserer unabhängigen Testredaktion genau unter die Lupe genommen. Profitieren Sie beim Motorradkauf von ausführlichen Einzel- und Vergleichstests sowie Dauertests und Fahrberichten zur KTM 690 SMC R. \u003c/p\u003e","headline":"KTM 690 SMC R"},"brandtreeOverview":"https://www.motorradonline.de/marken-modelle/","formel1Overview":null,"highlightF1":false,"highlightBrand":true,"offerings":[{"label":"Podcast","key":"podcast","url":"https://www.motorradonline.de/podcasts/"},{"label":"Newsletter","key":"newsletter","appendToUrl":"#archiv","element":"element-structure-newsletterbtn","url":"https://www.motorradonline.de/newsletter-registrierung/#archiv","baseUrl":"https://pag chen Technik ist sie ein Highlight im Supermoto-Segment.\u003c/p\u003e","headline":"KTM 690 SMC R","title":"\u003cp\u003eKTM 690 SMC R im Test bei MOTORRAD. Die Testfahrer und Testingenieure von MOTORRAD haben die KTM 690 SMC R ausführlich getestet. Dabei wurden Fahreigenschaften, Handhabung, Praxis im Alltag, Sicherheitsaspekte und Unterhaltskosten der KTM 690 SMC R von unserer unabhängigen Testredaktion genau unter die Lupe genommen. Profitieren Sie beim Motorradkauf von ausführlichen Einzel- und Vergleichstests sowie Dauertests und Fahrberichten zur KTM 690 SMC R. \u003c/p\u003e"},"project":"mrd","techData":[{"_id":1475,"techdata":{"ID":1713,"Slnr":2764,"Marke_ID":5664,"Baureihe_ID":435495,"Modell_ID":1475,"Modified":"2026-06-07T21:45:15.000Z","Created":null,"Hersteller_HerstellerID":29,"Baureihen_BaureiheID":428,"Modelle_ModellID":2765,"Hersteller_HerstellerName":"KTM","Baureihen_BaureiheName":"690 SMC R","Hersteller_ArbeitswertPreis":"k.A.","Hersteller_HerstellerName_Verbindung":"KTM 690 SMC R","Hersteller_HerstellerAnrede":"k.A.","Hersteller_HerstellerBezeichnung":"k.A.","Hersteller_HerstellerFax":"k.A.","Hersteller_HerstellerLand":"Deutschland","Hersteller_HerstellerOrt":"Ursensollen","Hersteller_HerstellerPartner":"k.A.","Hersteller_HerstellerPartner2":"k.A.","Hersteller_HerstellerPLZ":"92289","Hersteller_HerstellerStrasse":"Hohenburger Straße 55","Hersteller_HerstellerTelefon":"k.A.","Hersteller_HerstellerTelefon2":"k.A.","Hersteller_ImporteurAnrede":"k.A.","Hersteller_ImporteurFax":"k.A.","Hersteller_ImporteurName":"k.A.","Hersteller_ImporteurOrt":"k.A.","Hersteller_ImporteurPartner":"k.A.","Hersteller_ImporteurPartner2":"k.A.","Hersteller_ImporteurPLZ":"k.A.","Hersteller_ImporteurStrasse":"k.A.","Hersteller_ImporteurTelefon":"k.A.","Hersteller_ImporteurTelefon2":"k.A.","Hersteller_Vertragshaendler":"k.A.","Modelle_HerstellerCode":"B2","Modelle_ModellJahrBis":null,"Modelle_ModellJahrVon":2014,"Modelle_ModellJahrVonModellJahrBis":"2014 - ","Modelle_ModellNa
